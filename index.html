<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f766e"><title>My Budget</title>
  <link rel="manifest" href="manifest.json"><link rel="stylesheet" href="css/style.css">
  <style>
    #bottom-nav { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:3px; padding-left:max(6px,env(safe-area-inset-left)); padding-right:max(6px,env(safe-area-inset-right)); overflow:hidden; }
    #bottom-nav button { min-width:0; padding:8px 3px; font-size:clamp(.62rem,2.7vw,.78rem); overflow:hidden; text-overflow:ellipsis; }
  </style>
</head>
<body>
  <main id="app" aria-live="polite"></main>
  <nav id="bottom-nav" aria-label="Main navigation">
    <button data-view="dashboard">Overview</button><button data-view="expense">+ Expense</button><button data-view="income">+ Income</button><button data-view="history">History</button><button data-view="settings">Settings</button>
  </nav>
  <script src="js/db.js"></script><script src="js/budget.js"></script><script src="js/app.js"></script>
</body>
</html>
